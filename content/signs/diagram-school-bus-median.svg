<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- divided highway, top view -->
  <rect width="240" height="200" fill="#6DA544"/>
  <!-- far roadway (traffic going left) -->
  <rect x="0" y="12" width="240" height="64" fill="#666"/>
  <line x1="0" y1="14" x2="240" y2="14" stroke="#fff" stroke-width="3"/>
  <line x1="0" y1="74" x2="240" y2="74" stroke="#FFD100" stroke-width="3"/>
  <line x1="0" y1="44" x2="240" y2="44" stroke="#fff" stroke-width="2.5" stroke-dasharray="14 10"/>
  <!-- grass median -->
  <rect x="0" y="76" width="240" height="38" fill="#4E8A2E"/>
  <!-- near roadway (traffic going right) -->
  <rect x="0" y="114" width="240" height="64" fill="#666"/>
  <line x1="0" y1="116" x2="240" y2="116" stroke="#FFD100" stroke-width="3"/>
  <line x1="0" y1="176" x2="240" y2="176" stroke="#fff" stroke-width="3"/>
  <line x1="0" y1="146" x2="240" y2="146" stroke="#fff" stroke-width="2.5" stroke-dasharray="14 10"/>

  <text x="120" y="101" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#fff" text-anchor="middle">MEDIAN</text>

  <!-- school bus heading left on the far side -->
  <rect x="68" y="16" width="84" height="26" rx="4" fill="#FFB81C" stroke="#111" stroke-width="3"/>
  <rect x="71" y="19" width="9" height="20" rx="2" fill="#BFE3FF" stroke="#111" stroke-width="1.5"/>
  <g fill="#FF2A2A">
    <circle cx="74" cy="20" r="8" fill-opacity="0.35"/>
    <circle cx="74" cy="38" r="8" fill-opacity="0.35"/>
    <circle cx="146" cy="20" r="8" fill-opacity="0.35"/>
    <circle cx="146" cy="38" r="8" fill-opacity="0.35"/>
    <circle cx="74" cy="20" r="3.5"/>
    <circle cx="74" cy="38" r="3.5"/>
    <circle cx="146" cy="20" r="3.5"/>
    <circle cx="146" cy="38" r="3.5"/>
  </g>
  <!-- stop arm out on the driver side -->
  <line x1="90" y1="42" x2="90" y2="48" stroke="#111" stroke-width="3"/>
  <polygon points="85.5,47 94.5,47 101,53.5 101,62.5 94.5,69 85.5,69 79,62.5 79,53.5" fill="#C8102E" stroke="#fff" stroke-width="2"/>

  <!-- car behind the bus on the far side: stops -->
  <rect x="164" y="17" width="5" height="25" fill="#fff"/>
  <g transform="translate(190 29) rotate(-90)">
    <rect x="-9" y="-16" width="18" height="32" rx="5" fill="#D7263D" stroke="#111" stroke-width="2"/>
    <rect x="-6.5" y="-9" width="13" height="6" rx="1.5" fill="#BFE3FF"/>
    <rect x="-6.5" y="7" width="13" height="4" rx="1.5" fill="#BFE3FF"/>
  </g>

  <!-- car on the near side: keeps going -->
  <g transform="translate(60 131) rotate(90)">
    <rect x="-9" y="-16" width="18" height="32" rx="5" fill="#1F6FD1" stroke="#111" stroke-width="2"/>
    <rect x="-6.5" y="-9" width="13" height="6" rx="1.5" fill="#BFE3FF"/>
    <rect x="-6.5" y="7" width="13" height="4" rx="1.5" fill="#BFE3FF"/>
  </g>
  <path d="M84 131 L168 131" stroke="#3CCB4A" stroke-width="7" stroke-linecap="round"/>
  <polygon points="186,131 166,120 166,142" fill="#3CCB4A"/>

  <text x="120" y="195" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#fff" text-anchor="middle">KEEP GOING</text>
</svg>
