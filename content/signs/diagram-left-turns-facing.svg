<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- intersection, top view -->
  <rect width="240" height="200" fill="#6DA544"/>
  <rect x="80" y="0" width="80" height="200" fill="#666"/>
  <rect x="0" y="60" width="240" height="80" fill="#666"/>
  <g stroke="#FFD100" stroke-width="3">
    <line x1="120" y1="0" x2="120" y2="56"/>
    <line x1="120" y1="144" x2="120" y2="200"/>
    <line x1="0" y1="100" x2="76" y2="100"/>
    <line x1="164" y1="100" x2="240" y2="100"/>
  </g>

  <!-- turn paths: each car turns left in front of the other -->
  <g fill="none" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round">
    <path d="M140 200 L140 180 A100 100 0 0 0 40 80 L22 80" stroke="#BFE3FF"/>
    <path d="M100 0 L100 20 A100 100 0 0 0 200 120 L218 120" stroke="#FFD9A8"/>
  </g>
  <polygon points="6,80 22,70 22,90" fill="#BFE3FF"/>
  <polygon points="234,120 218,110 218,130" fill="#FFD9A8"/>

  <!-- northbound car turning left (heading northwest now) -->
  <g transform="translate(110.7 109.3) rotate(-45)">
    <rect x="-9" y="-16" width="18" height="32" rx="5" fill="#1F6FD1" stroke="#111" stroke-width="2"/>
    <rect x="-6.5" y="-9" width="13" height="6" rx="1.5" fill="#BFE3FF"/>
    <rect x="-6.5" y="7" width="13" height="4" rx="1.5" fill="#BFE3FF"/>
  </g>
  <!-- southbound car turning left (heading southeast now) -->
  <g transform="translate(129.3 90.7) rotate(135)">
    <rect x="-9" y="-16" width="18" height="32" rx="5" fill="#F47920" stroke="#111" stroke-width="2"/>
    <rect x="-6.5" y="-9" width="13" height="6" rx="1.5" fill="#BFE3FF"/>
    <rect x="-6.5" y="7" width="13" height="4" rx="1.5" fill="#BFE3FF"/>
  </g>
</svg>
