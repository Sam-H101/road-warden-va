<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- background and seat -->
  <rect width="200" height="200" rx="12" fill="#EAF4FB"/>
  <rect x="72" y="6" width="56" height="30" rx="12" fill="#555"/>
  <rect x="46" y="30" width="108" height="150" rx="22" fill="#555"/>

  <!-- person, front view -->
  <rect x="92" y="62" width="16" height="16" fill="#E0A878"/>
  <circle cx="100" cy="46" r="22" fill="#E0A878" stroke="#111" stroke-width="2.5"/>
  <path d="M78 44 Q78 22 100 22 Q122 22 122 44 Q112 32 100 33 Q88 32 78 44 Z" fill="#3B2414"/>
  <rect x="40" y="84" width="18" height="66" rx="9" fill="#2E86DE" stroke="#111" stroke-width="2.5"/>
  <rect x="142" y="84" width="18" height="66" rx="9" fill="#2E86DE" stroke="#111" stroke-width="2.5"/>
  <path d="M56 100 Q56 78 80 76 L120 76 Q144 78 144 100 L144 152 L56 152 Z" fill="#2E86DE" stroke="#111" stroke-width="2.5"/>
  <rect x="58" y="148" width="40" height="44" rx="6" fill="#2C3E50" stroke="#111" stroke-width="2.5"/>
  <rect x="102" y="148" width="40" height="44" rx="6" fill="#2C3E50" stroke="#111" stroke-width="2.5"/>

  <!-- shoulder belt: over the shoulder, across the chest -->
  <line x1="138" y1="58" x2="68" y2="154" stroke="#222" stroke-width="15"/>
  <line x1="138" y1="58" x2="68" y2="154" stroke="#777" stroke-width="2"/>
  <!-- lap belt: low across the hips and upper thighs -->
  <line x1="50" y1="156" x2="150" y2="156" stroke="#222" stroke-width="15"/>
  <line x1="50" y1="156" x2="150" y2="156" stroke="#777" stroke-width="2"/>
  <rect x="56" y="145" width="22" height="22" rx="3" fill="#C9CED3" stroke="#111" stroke-width="2.5"/>

  <!-- correct-fit check badge -->
  <circle cx="172" cy="28" r="22" fill="#2E9E44" stroke="#fff" stroke-width="3"/>
  <path d="M161 28 L169 37 L184 19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
