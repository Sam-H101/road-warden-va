<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- three-lane road, top view, car heading up -->
  <rect width="240" height="200" fill="#6DA544"/>
  <rect x="28" y="0" width="184" height="200" fill="#666"/>
  <line x1="30" y1="0" x2="30" y2="200" stroke="#fff" stroke-width="3"/>
  <line x1="210" y1="0" x2="210" y2="200" stroke="#fff" stroke-width="3"/>
  <line x1="90" y1="0" x2="90" y2="200" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- car hiding in the left blind spot -->
  <g transform="translate(62 142)">
    <rect x="-14" y="-26" width="28" height="52" rx="8" fill="#BBB" stroke="#111" stroke-width="2.5"/>
    <rect x="-10" y="-15" width="20" height="9" rx="2" fill="#BFE3FF"/>
  </g>

  <!-- blind spot zones, rear left and rear right -->
  <g fill="#E53935" fill-opacity="0.5" stroke="#C8102E" stroke-width="2.5" stroke-linejoin="round">
    <path d="M98 92 L34 106 L34 184 L98 140 Z"/>
    <path d="M142 92 L206 106 L206 184 L142 140 Z"/>
  </g>

  <!-- your car -->
  <rect x="96" y="70" width="6" height="8" rx="2" fill="#111"/>
  <rect x="138" y="70" width="6" height="8" rx="2" fill="#111"/>
  <rect x="100" y="52" width="40" height="76" rx="11" fill="#1F6FD1" stroke="#111" stroke-width="3"/>
  <rect x="105" y="66" width="30" height="13" rx="3" fill="#BFE3FF"/>
  <rect x="105" y="110" width="30" height="9" rx="3" fill="#BFE3FF"/>
  <polygon points="120,16 108,34 132,34" fill="#fff"/>
</svg>
