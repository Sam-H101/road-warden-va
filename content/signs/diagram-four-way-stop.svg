<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- intersection, top view -->
  <rect width="240" height="200" fill="#6DA544"/>
  <rect x="80" y="0" width="80" height="200" fill="#666"/>
  <rect x="0" y="60" width="240" height="80" fill="#666"/>

  <!-- center lines on each approach -->
  <g stroke="#FFD100" stroke-width="3">
    <line x1="120" y1="0" x2="120" y2="54"/>
    <line x1="120" y1="146" x2="120" y2="200"/>
    <line x1="0" y1="100" x2="74" y2="100"/>
    <line x1="166" y1="100" x2="240" y2="100"/>
  </g>
  <!-- stop lines -->
  <g fill="#fff">
    <rect x="120" y="144" width="40" height="5"/>
    <rect x="80" y="51" width="40" height="5"/>
    <rect x="71" y="100" width="5" height="40"/>
    <rect x="164" y="60" width="5" height="40"/>
  </g>

  <!-- a stop sign on every corner -->
  <g fill="#C8102E" stroke="#fff" stroke-width="2.5">
    <polygon transform="translate(176 158)" points="-5.4,-13 5.4,-13 13,-5.4 13,5.4 5.4,13 -5.4,13 -13,5.4 -13,-5.4"/>
    <polygon transform="translate(64 42)" points="-5.4,-13 5.4,-13 13,-5.4 13,5.4 5.4,13 -5.4,13 -13,5.4 -13,-5.4"/>
    <polygon transform="translate(64 158)" points="-5.4,-13 5.4,-13 13,-5.4 13,5.4 5.4,13 -5.4,13 -13,5.4 -13,-5.4"/>
    <polygon transform="translate(176 42)" points="-5.4,-13 5.4,-13 13,-5.4 13,5.4 5.4,13 -5.4,13 -13,5.4 -13,-5.4"/>
  </g>

  <!-- car arriving from the left -->
  <g transform="translate(48 120) rotate(90) scale(1.15)">
    <rect x="-9" y="-16" width="18" height="32" rx="5" fill="#1F6FD1" stroke="#111" stroke-width="2"/>
    <rect x="-6.5" y="-9" width="13" height="6" rx="1.5" fill="#BFE3FF"/>
    <rect x="-6.5" y="7" width="13" height="4" rx="1.5" fill="#BFE3FF"/>
  </g>
  <!-- car arriving from the bottom (on the first car's right) -->
  <g transform="translate(140 172) scale(1.15)">
    <rect x="-9" y="-16" width="18" height="32" rx="5" fill="#F47920" stroke="#111" stroke-width="2"/>
    <rect x="-6.5" y="-9" width="13" height="6" rx="1.5" fill="#BFE3FF"/>
    <rect x="-6.5" y="7" width="13" height="4" rx="1.5" fill="#BFE3FF"/>
  </g>
</svg>
