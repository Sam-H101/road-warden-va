<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- sky and hill (road rises to the right) -->
  <rect width="240" height="200" fill="#EAF4FB"/>
  <path d="M0 175 L240 115 L240 200 L0 200 Z" fill="#6DA544"/>

  <!-- car parked facing uphill -->
  <g transform="translate(150 137.5) rotate(-14.04)">
    <path d="M-48 -12 L-48 -26 Q-48 -30 -44 -30 L-26 -30 L-16 -46 L18 -46 L30 -30 L44 -30 Q48 -30 48 -26 L48 -12 Z" fill="#1F6FD1" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-13 -42 L-1 -42 L-1 -31 L-21 -31 Z" fill="#BFE3FF"/>
    <path d="M3 -42 L16 -42 L24 -31 L3 -31 Z" fill="#BFE3FF"/>
    <rect x="42" y="-27" width="6" height="5" fill="#FFD100"/>
    <circle cx="-28" cy="-10" r="10" fill="#111"/>
    <circle cx="-28" cy="-10" r="4" fill="#AAA"/>
    <circle cx="28" cy="-10" r="10" fill="#111"/>
    <circle cx="28" cy="-10" r="4" fill="#AAA"/>
  </g>

  <!-- curb along the road, in front of the wheels -->
  <path d="M0 168 L240 108 L240 121 L0 181 Z" fill="#D0D0D0" stroke="#777" stroke-width="2"/>

  <text x="180" y="184" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#fff" text-anchor="middle">UPHILL</text>

  <!-- top view inset: front wheels turned left, away from the curb -->
  <g transform="translate(8 8)">
    <rect x="0" y="0" width="100" height="96" rx="8" fill="#777"/>
    <rect x="80" y="0" width="20" height="96" fill="#D0D0D0"/>
    <line x1="80" y1="0" x2="80" y2="96" stroke="#777" stroke-width="2"/>
    <polygon points="42,4 33,15 51,15" fill="#fff"/>
    <rect x="18" y="25" width="10" height="20" rx="3" fill="#111" transform="rotate(-28 23 35)"/>
    <rect x="56" y="25" width="10" height="20" rx="3" fill="#111" transform="rotate(-28 61 35)"/>
    <rect x="18" y="63" width="10" height="20" rx="3" fill="#111"/>
    <rect x="56" y="63" width="10" height="20" rx="3" fill="#111"/>
    <rect x="26" y="20" width="32" height="70" rx="8" fill="#1F6FD1" stroke="#111" stroke-width="2.5"/>
    <rect x="30" y="32" width="24" height="10" rx="2" fill="#BFE3FF"/>
    <rect x="30" y="74" width="24" height="7" rx="2" fill="#BFE3FF"/>
    <rect x="0" y="0" width="100" height="96" rx="8" fill="none" stroke="#111" stroke-width="3"/>
  </g>
  <text x="58" y="124" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#111" text-anchor="middle">TURN AWAY</text>
  <text x="58" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#111" text-anchor="middle">FROM CURB</text>
</svg>
