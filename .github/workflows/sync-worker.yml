name: Deploy sync worker

# Deploys server/ to Cloudflare Workers. Runs only when the CLOUDFLARE_API_TOKEN
# secret exists, so forks and unconfigured copies skip it.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/sync-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 20

      - name: Test
        if: env.HAS_TOKEN == 'true'
        working-directory: server
        run: |
          npm ci
          npx vitest run

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
